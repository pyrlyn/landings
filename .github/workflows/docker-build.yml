name: docker-build

# Build-check the landing images on push to main and on pull requests. Images are not pushed.
# Both images need backend:landing-client from maven.pkg.github.com/pyrlyn/backend. Maven packages on
# GitHub Packages are scoped to their repository, so this repository's GITHUB_TOKEN cannot read them:
# BACKEND_PACKAGES_TOKEN must hold a personal access token (classic) with read:packages.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paas:
    name: landings/pyrlyn/Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require BACKEND_PACKAGES_TOKEN
        env:
          BACKEND_PACKAGES_TOKEN: ${{ secrets.BACKEND_PACKAGES_TOKEN }}
        run: |
          if [ -z "$BACKEND_PACKAGES_TOKEN" ]; then
            echo "::error::Secret BACKEND_PACKAGES_TOKEN is not set: a PAT (classic) with read:packages is needed to read backend:landing-client from pyrlyn/backend."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: landings/pyrlyn
          file: landings/pyrlyn/Dockerfile
          push: false
          # A BuildKit secret, not a build-arg: it is not recorded in the image or the cache.
          secrets: |
            GITHUB_TOKEN=${{ secrets.BACKEND_PACKAGES_TOKEN }}
          cache-from: type=gha,scope=landing-paas
          cache-to: type=gha,mode=max,scope=landing-paas

  static:
    name: landings/pyrlyn/docker/static/Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require BACKEND_PACKAGES_TOKEN
        env:
          BACKEND_PACKAGES_TOKEN: ${{ secrets.BACKEND_PACKAGES_TOKEN }}
        run: |
          if [ -z "$BACKEND_PACKAGES_TOKEN" ]; then
            echo "::error::Secret BACKEND_PACKAGES_TOKEN is not set: a PAT (classic) with read:packages is needed to read backend:landing-client from pyrlyn/backend."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Generate static site
        working-directory: landings/pyrlyn
        env:
          SITE_URL: https://pyrlyn.dev
          SITE_BASE: /
          GITHUB_TOKEN: ${{ secrets.BACKEND_PACKAGES_TOKEN }}
        run: ./gradlew generateSite
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: landings/pyrlyn/build/site
          file: landings/pyrlyn/docker/static/Dockerfile
          build-contexts: conf=landings/pyrlyn/docker/static
          push: false
          cache-from: type=gha,scope=landing-static
          cache-to: type=gha,mode=max,scope=landing-static
